<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperspectral cube viewer</title>
<style>
  :root {
    --bg: #0f1114;
    --panel: #16191d;
    --border: #262b31;
    --border-strong: #3d4249;
    --text: #e6e8ea;
    --muted: #8a9099;
    --accent: #5b9dd9;
    --danger: #d97a5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: clamp(14px, 1vw, 18px)/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: clamp(20px, 2.5vw, 48px);
    min-height: 100vh;
  }

  .logo { height: clamp(48px, 6vw, 100px); width: auto; display: block; margin-bottom: clamp(14px, 1.5vw, 28px); opacity: 0.95; }
  h1 { font-size: clamp(22px, 2.2vw, 36px); font-weight: 500; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: clamp(13px, 1vw, 17px); margin-bottom: clamp(20px, 2vw, 32px); }

  .drop-row { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(12px, 1.2vw, 20px); }
  @media (max-width: 620px) { .drop-row { grid-template-columns: 1fr; } }
  .drop-slot {
    padding: clamp(20px, 2.2vw, 36px);
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    background: var(--panel);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    min-height: clamp(96px, 10vw, 140px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    position: relative;
  }
  .drop-slot:hover, .drop-slot.hover { border-color: var(--accent); background: #1a1e24; }
  .drop-slot.filled { border-style: solid; text-align: left; min-height: 0; padding: clamp(14px, 1.4vw, 22px); }
  .drop-slot input { display: none; }
  .drop-slot .kind { font-size: clamp(10px, 0.75vw, 13px); color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 500; }
  .drop-slot .prompt { font-size: clamp(13px, 1vw, 17px); }
  .drop-slot .prompt strong { font-family: ui-monospace, Menlo, monospace; font-weight: 500; }
  .drop-slot .fname { font-family: ui-monospace, Menlo, monospace; font-size: clamp(12px, 0.9vw, 15px); word-break: break-all; color: var(--text); padding-right: 20px; }
  .drop-slot .size { font-size: clamp(11px, 0.8vw, 14px); color: var(--muted); margin-top: 4px; }
  .drop-slot .clear-btn {
    position: absolute; top: 8px; right: 8px;
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 2px 6px; font-size: clamp(14px, 1.1vw, 18px); line-height: 1;
  }
  .drop-slot .clear-btn:hover { color: var(--danger); }

  #status { color: var(--muted); font-size: clamp(12px, 0.9vw, 15px); margin: 12px 0; min-height: 18px; }
  #status.error { color: var(--danger); }

  #progress { margin: 12px 0; }
  .progress-label { font-size: clamp(12px, 0.9vw, 14px); color: var(--muted); margin-bottom: 6px; font-family: ui-monospace, Menlo, monospace; display: flex; justify-content: space-between; }
  .progress-track { height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
  .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.15s; }

  .layout { display: grid; grid-template-columns: auto 1fr; gap: clamp(16px, 1.6vw, 28px); align-items: start; margin-top: clamp(16px, 1.6vw, 28px); }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: clamp(16px, 1.6vw, 28px);
  }
  .label { font-size: clamp(11px, 0.85vw, 14px); color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

  #cube {
    display: block;
    background: #000;
    border-radius: 4px;
    cursor: crosshair;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    max-width: 100%;
  }

  .bandpickers { display: grid; grid-template-columns: 22px 1fr clamp(90px, 8vw, 130px); gap: 8px 14px; align-items: center; margin-top: 16px; font-size: clamp(12px, 0.95vw, 15px); }
  .bandpickers input[type=range] { width: 100%; margin: 0; }
  .bandpickers .val { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: clamp(11px, 0.85vw, 13px); text-align: right; }

  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }

  #legend { margin-top: 14px; font-size: clamp(12px, 0.9vw, 14px); display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: rgba(255,255,255,0.03); border-radius: 4px; font-family: ui-monospace, Menlo, monospace; font-size: clamp(11px, 0.85vw, 13px); }
  .legend-item .name { flex: 1; }
  .legend-item button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: clamp(14px, 1.1vw, 17px); line-height: 1; }
  .legend-item button:hover { color: var(--danger); }

  button.btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border-strong);
    padding: 8px 14px;
    border-radius: 4px;
    font-size: clamp(12px, 0.9vw, 15px);
    cursor: pointer;
    font-family: inherit;
  }
  button.btn:hover { border-color: var(--accent); }
  button.btn:disabled { opacity: 0.4; cursor: not-allowed; }

  select, input[type=range] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: clamp(12px, 0.9vw, 14px);
  }

  #tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(0,0,0,0.9);
    color: #fff;
    font-size: clamp(11px, 0.85vw, 13px);
    padding: 5px 10px;
    border-radius: 3px;
    display: none;
    z-index: 100;
    font-family: ui-monospace, Menlo, monospace;
  }

  .meta {
    font-family: ui-monospace, Menlo, monospace;
    font-size: clamp(11px, 0.85vw, 13px);
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.7;
  }
  .meta span { color: var(--text); }

  #spec { display: block; max-width: 100%; height: auto; }

  .stretch-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 12px; }
  .stretch-row .label { margin-bottom: 0; }
</style>
</head>

<h1>Hyperspectral cube viewer</h1>
<div class="sub">Drop an ENVI header (.hdr) plus its binary cube (.bip / .bil / .bsq / .raw). Everything runs locally in your browser — nothing is uploaded.</div>

<div class="drop-row">
  <div class="drop-slot" id="dz-hdr">
    <div class="kind">Header</div>
    <div class="slot-body"></div>
    <input type="file" accept=".hdr">
  </div>
  <div class="drop-slot" id="dz-bin">
    <div class="kind">Cube binary</div>
    <div class="slot-body"></div>
    <input type="file" accept=".bip,.bil,.bsq,.raw,.dat,.img,.cube">
  </div>
</div>

<div id="status"></div>

<div id="progress" style="display:none">
  <div class="progress-label"><span class="progress-text">Scanning…</span><span class="progress-pct">0%</span></div>
  <div class="progress-track"><div class="progress-bar"></div></div>
</div>

<div id="app" style="display:none">
  <div class="layout">
    <div class="panel" style="min-width: 340px">
      <div class="label">RGB composite</div>
      <canvas id="cube"></canvas>
      <div class="bandpickers">
        <span style="color:#e24b4a; font-weight: 500">R</span>
        <input type="range" id="rBand" min="0">
        <span class="val" id="rLabel"></span>

        <span style="color:#97c459; font-weight: 500">G</span>
        <input type="range" id="gBand" min="0">
        <span class="val" id="gLabel"></span>

        <span style="color:#5b9dd9; font-weight: 500">B</span>
        <input type="range" id="bBand" min="0">
        <span class="val" id="bLabel"></span>
      </div>
      <div class="stretch-row">
        <span class="label">Stretch</span>
        <select id="stretch">
          <option value="p2p98">2–98 percentile</option>
          <option value="minmax">Min–max</option>
          <option value="none">None</option>
        </select>
      </div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="panel">
      <div class="label">Spectrum <span style="text-transform: none; color: var(--muted); letter-spacing: 0; margin-left: 6px">click a pixel to sample</span></div>
      <canvas id="spec" width="600" height="340"></canvas>
      <div id="legend"></div>
      <div style="margin-top: 14px; display: flex; gap: 8px">
        <button class="btn" id="save">Save spectrum</button>
        <button class="btn" id="clear">Clear saved</button>
        <button class="btn" id="export">Export CSV</button>
      </div>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script>
const $ = id => document.getElementById(id);

const DTYPE = {
  1:  { name: 'uint8',   Ctor: Uint8Array,   bytes: 1 },
  2:  { name: 'int16',   Ctor: Int16Array,   bytes: 2 },
  3:  { name: 'int32',   Ctor: Int32Array,   bytes: 4 },
  4:  { name: 'float32', Ctor: Float32Array, bytes: 4 },
  5:  { name: 'float64', Ctor: Float64Array, bytes: 8 },
  12: { name: 'uint16',  Ctor: Uint16Array,  bytes: 2 },
  13: { name: 'uint32',  Ctor: Uint32Array,  bytes: 4 },
};

const COLORS = ['#e24b4a', '#97c459', '#5b9dd9', '#f0a020', '#b57edc', '#5bd9c2', '#d95bae', '#c2d95b', '#d97a5b'];

const S = {
  file: null, data: null, rgb: null,
  samples: 0, lines: 0, bands: 0,
  interleave: 'bip', dtype: null, wavelengths: null,
  byteOrder: 0, offset: 0,
  rB: 0, gB: 0, bB: 0,
  current: null,
  spectra: [],
  colorIdx: 0,
  loading: false,
  scanToken: 0,
};

function parseHDR(text) {
  const hdr = {};
  const flat = text.replace(/\{([\s\S]*?)\}/g, (m, inner) => '{' + inner.replace(/\s+/g, ' ') + '}');
  flat.split('\n').forEach(line => {
    const eq = line.indexOf('=');
    if (eq < 0) return;
    const key = line.slice(0, eq).trim().toLowerCase();
    let val = line.slice(eq + 1).trim();
    if (val.startsWith('{') && val.endsWith('}')) {
      val = val.slice(1, -1).split(',').map(s => s.trim()).filter(s => s.length);
    }
    hdr[key] = val;
  });
  return hdr;
}

function interpretHDR(hdr) {
  const s = {
    samples: +hdr.samples,
    lines: +hdr.lines,
    bands: +hdr.bands,
    interleave: (hdr.interleave || 'bsq').toLowerCase(),
    dtype: DTYPE[+hdr['data type']],
    byteOrder: +hdr['byte order'] || 0,
    offset: +hdr['header offset'] || 0,
  };
  if (Array.isArray(hdr.wavelength)) {
    s.wavelengths = hdr.wavelength.map(Number);
  } else {
    s.wavelengths = Array.from({length: s.bands}, (_, i) => i);
  }
  return s;
}

function readFile(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsArrayBuffer(f);
  });
}

async function loadFiles(files) {
  setStatus('Reading header…');

  let hdrFile = null, binFile = null;
  for (const f of files) {
    if (f.name.toLowerCase().endsWith('.hdr')) hdrFile = f;
    else if (!binFile || f.size > binFile.size) binFile = f;
  }

  if (!hdrFile) return setStatus('Missing .hdr file — you need both header and binary.', true);
  if (!binFile) return setStatus('Missing binary cube file (.bip / .bil / .bsq / .raw).', true);

  const hdrText = await hdrFile.text();
  const hdr = parseHDR(hdrText);
  const info = interpretHDR(hdr);

  if (!info.dtype) return setStatus(`Unsupported data type: ${hdr['data type']}`, true);
  if (!info.samples || !info.lines || !info.bands) return setStatus('Header missing samples / lines / bands.', true);

  const expected = info.samples * info.lines * info.bands * info.dtype.bytes + info.offset;
  if (binFile.size < expected) {
    return setStatus(`Binary too small (${binFile.size} bytes, expected ≥ ${expected}).`, true);
  }

  Object.assign(S, info);
  S.file = binFile;
  S.data = null;
  S.rgb = null;
  S.spectra = [];
  S.colorIdx = 0;

  const wlNote = (info.wavelengths[0] > 100 && info.wavelengths[0] < 3000)
    ? ` · ${info.wavelengths[0].toFixed(0)}–${info.wavelengths[info.wavelengths.length - 1].toFixed(0)} nm`
    : '';
  setStatus(`Loaded ${hdrFile.name}${wlNote} · ${(binFile.size/1e6).toFixed(0)} MB ${info.interleave.toUpperCase()}`);

  initUI();
  await rebuildRGB();
}

function swapBytesInPlace(buf, bpp) {
  const view = new DataView(buf);
  const n = buf.byteLength / bpp;
  if (bpp === 2) {
    for (let i = 0; i < n; i++) view.setUint16(i * 2, view.getUint16(i * 2, false), true);
  } else if (bpp === 4) {
    for (let i = 0; i < n; i++) view.setUint32(i * 4, view.getUint32(i * 4, false), true);
  } else if (bpp === 8) {
    for (let i = 0; i < n; i++) {
      const hi = view.getUint32(i * 8, false), lo = view.getUint32(i * 8 + 4, false);
      view.setUint32(i * 8, lo, true);
      view.setUint32(i * 8 + 4, hi, true);
    }
  }
}

async function readSlice(byteOffset, byteLen) {
  const start = S.offset + byteOffset;
  const blob = S.file.slice(start, start + byteLen);
  const buf = await blob.arrayBuffer();
  if (S.byteOrder === 1 && S.dtype.bytes > 1) swapBytesInPlace(buf, S.dtype.bytes);
  return new S.dtype.Ctor(buf);
}

async function spectrumAt(row, col) {
  const {samples, lines, bands, interleave, dtype} = S;
  const bpp = dtype.bytes;
  const spec = new Float32Array(bands);

  if (interleave === 'bip') {
    const byteOff = (row * samples + col) * bands * bpp;
    const arr = await readSlice(byteOff, bands * bpp);
    for (let b = 0; b < bands; b++) spec[b] = arr[b];
  } else if (interleave === 'bil') {
    const rowBytes = bands * samples * bpp;
    const arr = await readSlice(row * rowBytes, rowBytes);
    for (let b = 0; b < bands; b++) spec[b] = arr[b * samples + col];
  } else {
    const bandBytes = samples * lines * bpp;
    const pxOff = (row * samples + col) * bpp;
    const BATCH = 64;
    for (let i = 0; i < bands; i += BATCH) {
      const end = Math.min(i + BATCH, bands);
      const promises = [];
      for (let b = i; b < end; b++) promises.push(readSlice(b * bandBytes + pxOff, bpp));
      const results = await Promise.all(promises);
      for (let j = 0; j < results.length; j++) spec[i + j] = results[j][0];
    }
  }
  return spec;
}

async function scanRGB(onProgress) {
  const {samples, lines, bands, interleave, dtype, rB, gB, bB} = S;
  const bpp = dtype.bytes;
  const nPix = samples * lines;
  const rgb = { r: new Float32Array(nPix), g: new Float32Array(nPix), b: new Float32Array(nPix) };
  const myToken = S.scanToken;

  if (interleave === 'bsq') {
    const bandBytes = samples * lines * bpp;
    const jobs = [{band: rB, dst: rgb.r}, {band: gB, dst: rgb.g}, {band: bB, dst: rgb.b}];
    for (let j = 0; j < jobs.length; j++) {
      const {band, dst} = jobs[j];
      const arr = await readSlice(band * bandBytes, bandBytes);
      if (S.scanToken !== myToken) return null;
      for (let i = 0; i < nPix; i++) dst[i] = arr[i];
      onProgress((j + 1) / 3);
    }
  } else if (interleave === 'bil') {
    const lineBytes = bands * samples * bpp;
    const linesPerChunk = Math.max(1, Math.floor(64 * 1024 * 1024 / lineBytes));
    for (let row = 0; row < lines; row += linesPerChunk) {
      const nRows = Math.min(linesPerChunk, lines - row);
      const chunk = await readSlice(row * lineBytes, nRows * lineBytes);
      if (S.scanToken !== myToken) return null;
      for (let dr = 0; dr < nRows; dr++) {
        const rowStart = (row + dr) * samples;
        const chunkRow = dr * bands * samples;
        for (let col = 0; col < samples; col++) {
          rgb.r[rowStart + col] = chunk[chunkRow + rB * samples + col];
          rgb.g[rowStart + col] = chunk[chunkRow + gB * samples + col];
          rgb.b[rowStart + col] = chunk[chunkRow + bB * samples + col];
        }
      }
      onProgress((row + nRows) / lines);
    }
  } else {
    const pxBytes = bands * bpp;
    const pxPerChunk = Math.max(1, Math.floor(64 * 1024 * 1024 / pxBytes));
    for (let px = 0; px < nPix; px += pxPerChunk) {
      const n = Math.min(pxPerChunk, nPix - px);
      const chunk = await readSlice(px * pxBytes, n * pxBytes);
      if (S.scanToken !== myToken) return null;
      for (let i = 0; i < n; i++) {
        rgb.r[px + i] = chunk[i * bands + rB];
        rgb.g[px + i] = chunk[i * bands + gB];
        rgb.b[px + i] = chunk[i * bands + bB];
      }
      onProgress((px + n) / nPix);
    }
  }
  return rgb;
}

function showProgress(label) {
  $('progress').style.display = '';
  $('progress').querySelector('.progress-text').textContent = label;
  $('progress').querySelector('.progress-pct').textContent = '0%';
  $('progress').querySelector('.progress-bar').style.width = '0%';
}
function updateProgress(pct) {
  const p = Math.round(pct * 100);
  $('progress').querySelector('.progress-bar').style.width = p + '%';
  $('progress').querySelector('.progress-pct').textContent = p + '%';
}
function hideProgress() {
  $('progress').style.display = 'none';
}

async function scanRGBPreview(onProgress) {
  const {samples, lines, bands, interleave, dtype, rB, gB, bB} = S;
  const bpp = dtype.bytes;
  const stride = Math.max(1, Math.ceil(Math.max(samples, lines) / 240));
  const pW = Math.ceil(samples / stride);
  const pH = Math.ceil(lines / stride);
  const nPix = pW * pH;
  const rgb = {
    r: new Float32Array(nPix),
    g: new Float32Array(nPix),
    b: new Float32Array(nPix),
    w: pW, h: pH, stride,
  };
  const myToken = S.scanToken;

  if (interleave === 'bsq') {
    const bandBytes = samples * lines * bpp;
    const jobs = [{band: rB, dst: rgb.r}, {band: gB, dst: rgb.g}, {band: bB, dst: rgb.b}];
    for (let j = 0; j < jobs.length; j++) {
      const {band, dst} = jobs[j];
      const arr = await readSlice(band * bandBytes, bandBytes);
      if (S.scanToken !== myToken) return null;
      for (let pr = 0; pr < pH; pr++) {
        const row = pr * stride;
        const rowStart = row * samples;
        const dstStart = pr * pW;
        for (let pc = 0; pc < pW; pc++) dst[dstStart + pc] = arr[rowStart + pc * stride];
      }
      onProgress((j + 1) / 3);
    }
  } else if (interleave === 'bil') {
    const lineBytes = bands * samples * bpp;
    for (let pr = 0; pr < pH; pr++) {
      const row = pr * stride;
      const chunk = await readSlice(row * lineBytes, lineBytes);
      if (S.scanToken !== myToken) return null;
      const dstStart = pr * pW;
      const rOff = rB * samples, gOff = gB * samples, bOff = bB * samples;
      for (let pc = 0; pc < pW; pc++) {
        const col = pc * stride;
        rgb.r[dstStart + pc] = chunk[rOff + col];
        rgb.g[dstStart + pc] = chunk[gOff + col];
        rgb.b[dstStart + pc] = chunk[bOff + col];
      }
      if (pr % 4 === 0) onProgress((pr + 1) / pH);
    }
  } else {
    const pxBytes = bands * bpp;
    const rowBytes = samples * pxBytes;
    for (let pr = 0; pr < pH; pr++) {
      const row = pr * stride;
      const chunk = await readSlice(row * rowBytes, rowBytes);
      if (S.scanToken !== myToken) return null;
      const dstStart = pr * pW;
      for (let pc = 0; pc < pW; pc++) {
        const col = pc * stride;
        const px = col * bands;
        rgb.r[dstStart + pc] = chunk[px + rB];
        rgb.g[dstStart + pc] = chunk[px + gB];
        rgb.b[dstStart + pc] = chunk[px + bB];
      }
      if (pr % 4 === 0) onProgress((pr + 1) / pH);
    }
  }
  onProgress(1);
  return rgb;
}

async function rebuildRGB() {
  const myToken = ++S.scanToken;
  S.loading = true;
  const t0 = performance.now();

  const runDiagnostics = (rgb, label) => {
    const stats = (arr, name) => {
      let mn = Infinity, mx = -Infinity, sum = 0, nan = 0, zero = 0;
      const step = Math.max(1, Math.floor(arr.length / 100000));
      let n = 0;
      for (let i = 0; i < arr.length; i += step) {
        const v = arr[i]; n++;
        if (Number.isNaN(v)) { nan++; continue; }
        if (v === 0) zero++;
        if (v < mn) mn = v;
        if (v > mx) mx = v;
        sum += v;
      }
      return { name, min: mn, max: mx, mean: sum / (n - nan), nanFrac: nan / n, zeroFrac: zero / n };
    };
    const rs = stats(rgb.r, 'R'), gs = stats(rgb.g, 'G'), bs = stats(rgb.b, 'B');
    console.log(`${label} band stats:`, rs, gs, bs);
    return [rs, gs, bs];
  };

  try {
    showProgress(`Building rough preview…`);
    const preview = await scanRGBPreview(p => { if (S.scanToken === myToken) updateProgress(p); });
    if (!preview || S.scanToken !== myToken) return;
    S.rgb = preview;
    renderCube();
    renderSpectra();
    renderLegend();
    const pStats = runDiagnostics(preview, 'Preview');
    S.file.slice(S.offset, S.offset + 32).arrayBuffer().then(b => {
      console.log('First 32 bytes at offset', S.offset + ':', [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(' '));
    });

    const degenerate = pStats.filter(s => !isFinite(s.min) || s.max - s.min < 1e-9 || s.nanFrac > 0.5);
    if (degenerate.length) {
      hideProgress();
      const names = degenerate.map(s => `${s.name}(min=${s.min}, max=${s.max}, NaN=${(s.nanFrac*100).toFixed(0)}%)`).join(', ');
      setStatus(`Blank preview — bands returned flat/invalid values: ${names}. Check console. Try Min–max stretch, different bands, or the data may need byte-swap.`, true);
      return;
    }
    setStatus(`Preview ready · click to sample · scanning full image…`);

    showProgress(`Full scan (${(S.file.size/1e6).toFixed(0)} MB, ${S.interleave.toUpperCase()})`);
    const full = await scanRGB(p => { if (S.scanToken === myToken) updateProgress(p); });
    if (!full || S.scanToken !== myToken) return;
    full.w = S.samples;
    full.h = S.lines;
    S.rgb = full;
    hideProgress();
    renderCube();
    runDiagnostics(full, 'Full');
    const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
    setStatus(`Loaded · full scan took ${elapsed}s`);
  } catch (err) {
    if (S.scanToken === myToken) {
      hideProgress();
      setStatus('Scan failed: ' + err.message, true);
    }
  } finally {
    if (S.scanToken === myToken) S.loading = false;
  }
}

function computeStretchFromArr(arr, mode) {
  const N = arr.length;
  const step = Math.max(1, Math.floor(N / 30000));
  const values = [];
  for (let i = 0; i < N; i += step) values.push(arr[i]);
  values.sort((a, b) => a - b);
  if (mode === 'p2p98') {
    const lo = values[Math.floor(values.length * 0.02)];
    const hi = values[Math.floor(values.length * 0.98)];
    return { lo, hi: hi > lo ? hi : lo + 1 };
  }
  if (mode === 'minmax') {
    const lo = values[0], hi = values[values.length - 1];
    return { lo, hi: hi > lo ? hi : lo + 1 };
  }
  const maxTypical = S.dtype.name.startsWith('float') ? 1 : (1 << Math.min(24, S.dtype.bytes * 8)) - 1;
  return { lo: 0, hi: maxTypical };
}

function computeCubeMaxWidth() {
  return Math.min(1000, Math.max(360, window.innerWidth * 0.42));
}

function sizeCubeCanvas() {
  const canvas = $('cube');
  if (!S.samples) return;
  const maxW = computeCubeMaxWidth();
  const scale = Math.min(1, maxW / S.samples);
  canvas.style.width = Math.round(S.samples * scale) + 'px';
  canvas.style.height = Math.round(S.lines * scale) + 'px';
}

function renderCube() {
  if (!S.rgb) return;
  const {rgb} = S;
  const w = rgb.w || S.samples;
  const h = rgb.h || S.lines;
  const canvas = $('cube');
  canvas.width = w;
  canvas.height = h;
  const maxW = computeCubeMaxWidth();
  const scale = Math.min(1, maxW / S.samples);
  canvas.style.width = Math.round(S.samples * scale) + 'px';
  canvas.style.height = Math.round(S.lines * scale) + 'px';

  const mode = $('stretch').value;
  const sr = computeStretchFromArr(rgb.r, mode);
  const sg = computeStretchFromArr(rgb.g, mode);
  const sb = computeStretchFromArr(rgb.b, mode);

  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h);
  const d = img.data;
  const rRange = sr.hi - sr.lo, gRange = sg.hi - sg.lo, bRange = sb.hi - sb.lo;
  const nPix = w * h;

  for (let i = 0; i < nPix; i++) {
    const idx = i * 4;
    const rv = (rgb.r[i] - sr.lo) / rRange;
    const gv = (rgb.g[i] - sg.lo) / gRange;
    const bv = (rgb.b[i] - sb.lo) / bRange;
    d[idx]     = rv < 0 ? 0 : rv > 1 ? 255 : rv * 255;
    d[idx + 1] = gv < 0 ? 0 : gv > 1 ? 255 : gv * 255;
    d[idx + 2] = bv < 0 ? 0 : bv > 1 ? 255 : bv * 255;
    d[idx + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);

  const previewNote = rgb.stride && rgb.stride > 1 ? ` · preview 1/${rgb.stride}` : '';
  $('meta').innerHTML = `<div><span>${S.samples} × ${S.lines} × ${S.bands}</span> · ${S.dtype.name} · ${S.interleave.toUpperCase()}${previewNote}</div>`;
}

function niceTicks(min, max, n) {
  if (max <= min) return [min];
  const range = max - min;
  const rough = range / n;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  let step;
  if (norm < 1.5) step = 1 * mag;
  else if (norm < 3) step = 2 * mag;
  else if (norm < 7) step = 5 * mag;
  else step = 10 * mag;
  const ticks = [];
  const start = Math.ceil(min / step) * step;
  for (let t = start; t <= max + step * 0.001; t += step) ticks.push(t);
  return ticks;
}

function fmt(n) {
  if (n === 0) return '0';
  const abs = Math.abs(n);
  if (abs >= 10000 || abs < 0.001) return n.toExponential(1);
  if (Number.isInteger(n)) return n.toString();
  if (abs < 1) return n.toFixed(3);
  if (abs < 10) return n.toFixed(2);
  return n.toFixed(1);
}

function renderSpectra() {
  const canvas = $('spec');
  const parent = canvas.parentElement;
  const parentStyle = getComputedStyle(parent);
  const parentPad = parseFloat(parentStyle.paddingLeft) + parseFloat(parentStyle.paddingRight);
  const targetW = Math.max(360, Math.min(1500, parent.clientWidth - parentPad));
  const targetH = Math.round(targetW * 0.56);
  canvas.width = targetW;
  canvas.height = targetH;
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  const fontSize = Math.max(11, Math.min(16, W * 0.018));
  const pad = { l: Math.max(50, fontSize * 4.5), r: 14, t: 14, b: Math.max(38, fontSize * 3.2) };
  const pW = W - pad.l - pad.r, pH = H - pad.t - pad.b;

  const wl = S.wavelengths || [];
  if (!wl.length) return;
  const xMin = wl[0], xMax = wl[wl.length - 1];

  const drawList = [...S.spectra];
  if (S.current) drawList.push(S.current);

  let yMin = Infinity, yMax = -Infinity;
  for (const s of drawList) {
    if (!s.values) continue;
    for (const v of s.values) {
      if (v < yMin) yMin = v;
      if (v > yMax) yMax = v;
    }
  }
  if (yMin === Infinity) { yMin = 0; yMax = 1; }
  if (yMax === yMin) yMax = yMin + 1;
  const yRange = yMax - yMin;
  yMin -= yRange * 0.05;
  yMax += yRange * 0.05;

  ctx.font = `${fontSize}px -apple-system, sans-serif`;
  ctx.fillStyle = '#8a9099';

  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (const t of niceTicks(yMin, yMax, 5)) {
    const y = pad.t + pH * (1 - (t - yMin) / (yMax - yMin));
    ctx.strokeStyle = '#262b31';
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + pW, y); ctx.stroke();
    ctx.fillText(fmt(t), pad.l - 6, y);
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (const t of niceTicks(xMin, xMax, 6)) {
    const x = pad.l + pW * (t - xMin) / (xMax - xMin);
    ctx.fillText(fmt(t), x, pad.t + pH + 6);
  }

  const xAxisLabel = (xMin > 100 && xMin < 3000) ? 'Wavelength (nm)' : 'Band';
  ctx.fillText(xAxisLabel, pad.l + pW / 2, pad.t + pH + fontSize + 10);
  ctx.save();
  ctx.translate(fontSize + 2, pad.t + pH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('Value', 0, 0);
  ctx.restore();

  ctx.strokeStyle = '#3d4249';
  ctx.beginPath();
  ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, pad.t + pH); ctx.lineTo(pad.l + pW, pad.t + pH);
  ctx.stroke();

  for (const s of drawList) {
    if (!s.values) continue;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 1.4;
    ctx.setLineDash(s === S.current ? [4, 3] : []);
    ctx.beginPath();
    for (let i = 0; i < s.values.length; i++) {
      const x = pad.l + pW * (wl[i] - xMin) / (xMax - xMin);
      const y = pad.t + pH * (1 - (s.values[i] - yMin) / (yMax - yMin));
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);

  if (!drawList.length) {
    ctx.fillStyle = '#8a9099';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Click a pixel in the composite to sample its spectrum', pad.l + pW / 2, pad.t + pH / 2);
  }
}

function renderLegend() {
  const el = $('legend');
  el.innerHTML = '';

  if (S.current) {
    const div = document.createElement('div');
    div.className = 'legend-item';
    const label = S.current.loading
      ? `(${S.current.col}, ${S.current.row}) · reading…`
      : `(${S.current.col}, ${S.current.row}) · current (unsaved)`;
    div.innerHTML = `<span class="swatch" style="background:${S.current.color}${S.current.loading ? '; opacity:0.5' : ''}; border: 1px dashed ${S.current.color}"></span><span class="name">${label}</span>`;
    const dismiss = document.createElement('button');
    dismiss.textContent = '×';
    dismiss.title = 'Discard';
    dismiss.onclick = () => { S.current = null; renderLegend(); renderSpectra(); };
    div.appendChild(dismiss);
    el.appendChild(div);
  }

  S.spectra.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'legend-item';
    div.innerHTML = `<span class="swatch" style="background:${s.color}"></span><span class="name">(${s.col}, ${s.row})</span>`;
    const btn = document.createElement('button');
    btn.textContent = '×';
    btn.title = 'Remove';
    btn.onclick = () => {
      S.spectra.splice(i, 1);
      renderLegend();
      renderSpectra();
    };
    div.appendChild(btn);
    el.appendChild(div);
  });
}

function initUI() {
  $('app').style.display = '';

  const nearest = target => {
    let bi = 0, d = Infinity;
    S.wavelengths.forEach((w, i) => {
      const dd = Math.abs(w - target);
      if (dd < d) { d = dd; bi = i; }
    });
    return bi;
  };

  if (S.wavelengths && S.wavelengths[0] > 100 && S.wavelengths[0] < 3000) {
    S.rB = nearest(640);
    S.gB = nearest(550);
    S.bB = nearest(460);
  } else {
    S.rB = Math.round(S.bands * 0.7);
    S.gB = Math.round(S.bands * 0.5);
    S.bB = Math.round(S.bands * 0.25);
  }

  let bandChangeTimer;
  ['r', 'g', 'b'].forEach(c => {
    const inp = $(c + 'Band');
    inp.max = S.bands - 1;
    inp.value = S[c + 'B'];
    updateBandLabel(c);
    inp.oninput = () => {
      S[c + 'B'] = +inp.value;
      updateBandLabel(c);
      clearTimeout(bandChangeTimer);
      bandChangeTimer = setTimeout(() => { if (S.file) rebuildRGB(); }, 350);
    };
  });

  $('stretch').onchange = renderCube;

  const canvas = $('cube');
  canvas.onclick = async (e) => {
    if (!S.file) return;
    const rect = canvas.getBoundingClientRect();
    const col = Math.floor((e.clientX - rect.left) * S.samples / rect.width);
    const row = Math.floor((e.clientY - rect.top) * S.lines / rect.height);
    if (col < 0 || col >= S.samples || row < 0 || row >= S.lines) return;

    const color = '#5b9dd9';
    const entry = { row, col, values: null, color, loading: true };
    S.current = entry;
    renderLegend();
    renderSpectra();

    try {
      const spec = await spectrumAt(row, col);
      if (S.current !== entry) return;
      entry.values = Array.from(spec);
      entry.loading = false;
      renderLegend();
      renderSpectra();
    } catch (err) {
      if (S.current === entry) S.current = null;
      renderLegend();
      renderSpectra();
      setStatus('Read failed: ' + err.message, true);
    }
  };

  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const col = Math.floor((e.clientX - rect.left) * S.samples / rect.width);
    const row = Math.floor((e.clientY - rect.top) * S.lines / rect.height);
    if (col < 0 || col >= S.samples || row < 0 || row >= S.lines) {
      $('tooltip').style.display = 'none';
      return;
    }
    const tt = $('tooltip');
    tt.textContent = `(${col}, ${row})`;
    tt.style.left = (e.clientX + 12) + 'px';
    tt.style.top = (e.clientY + 12) + 'px';
    tt.style.display = 'block';
  };
  canvas.onmouseleave = () => { $('tooltip').style.display = 'none'; };

  $('save').onclick = () => {
    if (!S.current || !S.current.values) return;
    S.current.color = COLORS[S.colorIdx++ % COLORS.length];
    S.spectra.push(S.current);
    S.current = null;
    renderLegend();
    renderSpectra();
  };
  $('clear').onclick = () => {
    S.spectra = [];
    S.current = null;
    renderLegend();
    renderSpectra();
  };
  $('export').onclick = exportCSV;
}

function updateBandLabel(c) {
  const b = S[c + 'B'];
  const wl = S.wavelengths[b];
  $(c + 'Label').textContent = (wl > 100 && wl < 3000)
    ? `b${b} · ${wl.toFixed(1)} nm`
    : `band ${b}`;
}

function exportCSV() {
  const ready = S.spectra.filter(s => s.values);
  if (!ready.length) { setStatus('No spectra to export yet.', true); return; }
  const wl = S.wavelengths;
  const header = ['wavelength', ...ready.map(s => `pixel_${s.col}_${s.row}`)];
  const rows = [header.join(',')];
  for (let i = 0; i < wl.length; i++) {
    rows.push([wl[i], ...ready.map(s => s.values[i])].join(','));
  }
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'spectra.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function setStatus(msg, isErr = false) {
  const el = $('status');
  el.textContent = msg;
  el.className = isErr ? 'error' : '';
}

const slotFiles = { hdr: null, bin: null };

function updateSlot(kind) {
  const slot = $('dz-' + kind);
  const body = slot.querySelector('.slot-body');
  const f = slotFiles[kind];
  if (!f) {
    slot.classList.remove('filled');
    const hint = kind === 'hdr' ? '.hdr' : '.bip / .bil / .bsq / .raw';
    body.innerHTML = `<div class="prompt">Drop <strong>${hint}</strong><br><span style="color:var(--muted); font-size: 11px">or click to browse</span></div>`;
  } else {
    slot.classList.add('filled');
    body.innerHTML = `
      <button class="clear-btn" title="Remove">×</button>
      <div class="fname">${f.name}</div>
      <div class="size">${(f.size / 1e6).toFixed(2)} MB</div>
    `;
    body.querySelector('.clear-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      slotFiles[kind] = null;
      updateSlot(kind);
    });
  }
}

function acceptFile(kind, file) {
  const isHdr = file.name.toLowerCase().endsWith('.hdr');
  if (kind === 'hdr' && !isHdr) {
    setStatus(`"${file.name}" doesn't look like a .hdr file — did you mean the other slot?`, true);
    return;
  }
  if (kind === 'bin' && isHdr) {
    setStatus(`"${file.name}" is a header — drop it in the Header slot instead.`, true);
    return;
  }
  slotFiles[kind] = file;
  updateSlot(kind);
  setStatus('');
  if (slotFiles.hdr && slotFiles.bin) {
    loadFiles([slotFiles.hdr, slotFiles.bin]);
  }
}

['hdr', 'bin'].forEach(kind => {
  const slot = $('dz-' + kind);
  const input = slot.querySelector('input');
  slot.addEventListener('click', (e) => {
    if (e.target.closest('.clear-btn')) return;
    input.click();
  });
  slot.addEventListener('dragover', (e) => { e.preventDefault(); slot.classList.add('hover'); });
  slot.addEventListener('dragleave', () => slot.classList.remove('hover'));
  slot.addEventListener('drop', (e) => {
    e.preventDefault();
    slot.classList.remove('hover');
    if (e.dataTransfer.files.length) acceptFile(kind, e.dataTransfer.files[0]);
  });
  input.addEventListener('change', () => {
    if (input.files.length) acceptFile(kind, input.files[0]);
    input.value = '';
  });
});

updateSlot('hdr');
updateSlot('bin');
renderSpectra();

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (S.rgb) sizeCubeCanvas();
    renderSpectra();
  }, 100);
});
</script>
</body>
</html>
